name: Actions Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Runner smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Confirm hosted runner starts
        run: |
          echo "GitHub-hosted runner started successfully"
          uname -a
          node --version
          npm --version
