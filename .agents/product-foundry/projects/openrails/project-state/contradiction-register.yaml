contradiction_register:
- id: CON-OR-001
  status: open
  severity: high
  blocking_for: distributed-web-release
  contradiction: The unified target is the Arc-led Jaydearcadian repository, while the accepted brand, design system, route structure, and GIWA System Lab source remain in the Cooke repository and have not been absorbed.
  resolution_path: Migrate the selected design and webapp system into the target repository, preserve Arc's lead narrative, and make network selection, deployment evidence, assets, receipts, and status adapter-driven.
- id: CON-OR-002
  status: open
  severity: high
  blocking_for: distributed-network-architecture
  contradiction: Arc is a proposed anchor candidate, but anchor responsibilities, source-of-truth rules, bridge or messaging trust, and failure isolation are undefined.
  resolution_path: Run system architecture, security, economics, and operational reviews before accepting or implementing an anchor topology.
- id: CON-OR-003
  status: open
  severity: high
  blocking_for: shared-interface-release
  contradiction: Jaydearcadian/mcosm-OpenRails is now the accepted public-package owner, but SDK and MCP implementations still differ across Arc, GIWA, and agent repositories and have not migrated to Shared Interface 1.0.
  resolution_path: Implement the shared package contract in the target repository, import adapter fixtures, define compatibility policy, and publish only after cross-network conformance and package review pass.
- id: CON-OR-006
  status: open
  severity: high
  blocking_for: shared-interface-release
  contradiction: Existing Arc, GIWA, and X Layer surfaces expose overlapping concepts with different object, state, error, and capability contracts.
  resolution_path: Canonicalize Shared Interface 1.0, implement per-network capability manifests, and prove permitted and blocked lifecycle conformance without claiming false parity.
- id: CON-OR-007
  status: open
  severity: high
  blocking_for: creator-production-claim
  contradiction: Subsonic materials combine implementation, demonstration, stale SDK patterns, and unsafe private-key deployment assumptions.
  resolution_path: Define the sidecar interface, remove custodial key requirements, update SDK usage, threat-model event and proof integrity, and validate a wallet-controlled lifecycle.
- id: CON-OR-004
  status: open
  severity: high
  blocking_for: cross-network-equivalence-claim
  contradiction: The repositories contain different network defaults and have not yet demonstrated behavioral conformance across Arc, GIWA, and X Layer. This does not block peer authority over each network's own deployment truth.
  resolution_path: Define a shared adapter contract and run ABI, signature-domain, settlement, receipt, and failure conformance tests on every supported network.
- id: CON-OR-005
  status: resolved
  severity: high
  contradiction: GoalSession had been at risk of being described as Workspace or as a Workspace-owned Path.
  resolution: Product Truth now defines GoalSession as a separate agent orchestration and session primitive that consumes OpenRails interfaces.
  decision: DEC-OR-003
- id: CON-OR-008
  status: resolved
  severity: high
  contradiction: A strict Workspace-to-Proof lifecycle conflicted with direct wallet-authorized Arc RailsFlow and RailsCard operations and implied that Proof must precede Paycard funding.
  resolution: Product Truth 2.0.1 defines direct wallet-authorized and delegated Runtime profiles, permits pre-work funding, and makes Proof conditional on a signed gating policy.
  decision: DEC-OR-015
- id: CON-OR-009
  status: resolved
  severity: high
  contradiction: Shared Interface 1.0.1 defines semantic vocabulary but does not yet provide typed object schemas, constraints, transitions, conditional requirements, operation contracts, receipt schemas, or structured error payloads.
  resolution: PR1 produced and validated the private `interface/` package with JSON Schema 2020-12 objects, direct and delegated conditionals, 23 machine-readable transitions and eight outcome rules, a 38-operation registry, all 24 current error codes, receipt and transaction reconciliation rules, deterministic generated TypeScript, an operation-bound runtime validator, and an Arc Testnet capability manifest that keeps Workspace Runtime not live.
  evidence:
  - interface/package.json version 0.1.0
  - interface/package-lock.json
  - interface/schemas
  - interface/registries/operation-registry.json
  - interface/registries/transition-rules.json
  - interface/manifests/arc-testnet.json
  - interface/src/generated.ts
  - interface/src/operations.ts
  - interface/scripts/pack-smoke.mjs
  - interface/test/contract.test.mjs
  - ABI audit of ArcOpenRailsHubV2Initializable, SDK, and cockpit representations recorded in the PR1 implementation handoff
  - npm run schemas:validate passed in interface/
  - npm run generate:check passed in interface/
  - npm test passed in interface/
  - npm run typecheck passed in interface/
  - npm run build passed in interface/
  - npm run pack:check passed in interface/
  residual_scope: SDK, MCP, REST, Runtime, worker, frontend, adapter, security, and cross-network conformance work remains pending.
- id: CON-OR-010
  status: resolved
  severity: high
  contradiction: The initial go-live definition required all peer networks and clients even though capability manifests may honestly declare behavior unavailable.
  resolution: Shared Interface 1.0.1 defines an Arc-led launch gate and treats other network and client conformance as separately verified integration gates.
  decision: DEC-OR-016
