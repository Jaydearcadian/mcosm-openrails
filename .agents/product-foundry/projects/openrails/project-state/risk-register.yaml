risk_register:
- id: RISK-OR-001
  severity: critical
  status: open
  risk: OpenRails is testnet-only and has no recorded third-party smart-contract audit in the inspected canonical sources.
  mitigation: Keep real-value and production claims excluded; require security assurance and release gates before mainnet.
- id: RISK-OR-002
  severity: critical
  status: open
  risk: A distributed anchor can create a false single source of truth, bridge dependency, replay surface, or correlated failure across otherwise independent networks.
  mitigation: Define anchor scope narrowly, preserve per-network finality, model bridge and message trust, and require isolation and rollback behavior before implementation.
- id: RISK-OR-003
  severity: high
  status: open
  risk: Cross-repository ABI, EIP-712 domain, chain configuration, SDK, and MCP drift can produce failed or unsafe transaction preparation.
  mitigation: Establish one interface authority and run generated-type, signature-domain, and cross-network conformance tests before publication.
- id: RISK-OR-004
  severity: high
  status: open
  risk: Projecting the GIWA web structure across three chains can expose stale addresses, wrong assets, mismatched RPCs, or misleading receipt links.
  mitigation: Use typed network manifests, chain assertions, provenance labels, wallet-state matrices, and end-to-end tests per adapter.
- id: RISK-OR-005
  severity: high
  status: open
  risk: Agent clients may blur proposal authority, gas payment, user approval, and transaction broadcasting responsibilities.
  mitigation: Preserve deterministic intent construction, explicit signer identity, wallet review, exact allowance display, receipt verification, and client-specific threat models.
- id: RISK-OR-006
  severity: medium
  status: open
  risk: Repository demonstrations may be mistaken for organic adoption or production evidence.
  mitigation: Keep repository-asserted, independently verified, and buyer-validated claims separate.
- id: RISK-OR-007
  severity: medium
  status: open
  risk: Physical repository merging before ownership decisions could erase useful network history and create package release conflicts.
  mitigation: Unify through authority, interfaces, adapters, and release policy first; move code only through an approved migration plan.
- id: RISK-OR-008
  severity: high
  status: open
  risk: Supporting three vertical directions can turn the shared interface into a generic feature catalogue with no decisive workflow.
  mitigation: Keep one canonical lifecycle and object model, require each vertical to use it, and select one first adoption wedge through evidence.
- id: RISK-OR-009
  severity: critical
  status: open
  risk: Creator or agent sidecars may hold private keys, fabricate usage evidence, replay events, or submit actions beyond the principal's Path.
  mitigation: Make sidecars read and prepare adapters, bind events to Proof, require wallet authorization for financial actions, and perform a dedicated threat model before production use.
- id: RISK-OR-010
  severity: high
  status: open
  risk: Flattening RailsFlow, RailsCard, Paycard Stream, and one-time or streamed modes can produce incorrect recipients, claim behavior, or settlement expectations.
  mitigation: Preserve the canonical terminology hierarchy in schemas, SDK types, MCP tools, REST routes, and web controls; add invariant and compatibility tests.
- id: RISK-OR-011
  severity: high
  status: open
  risk: The unified frontend migration could overwrite the target's pre-existing RPC, permit, recipient-bound RailsCard, QR, or transaction-lifecycle fixes.
  mitigation: Keep those files outside the first migration write set, isolate the work on a focused branch, record the baseline, and require explicit scope expansion before touching transaction code.
- id: RISK-OR-012
  severity: high
  status: open
  risk: Copying the Cooke webapp wholesale could replace the target's Arc wallet and transaction authority with GIWA-specific contracts, network constants, Node services, or agent-kernel dependencies.
  mitigation: Import only the network-neutral design package and selected visual structures; preserve the Jayde provider and transaction layer and add peer networks through typed capability manifests.
- id: RISK-OR-013
  severity: high
  status: mitigated
  risk: Implementing SDK, MCP, REST, adapters, or frontend state from the semantic vocabulary inventory alone could create incompatible identifiers, transitions, authorization requirements, receipts, and errors.
  mitigation: PR1 provides a private, versioned JSON Schema 2020-12 contract, deterministic generated TypeScript, direct and delegated profile conditionals, transition and outcome rules, a complete operation registry, an exported operation-bound validator, structured error taxonomy, receipt reconciliation requirements, ABI-aligned contract representations, and an Arc capability manifest. Package validation and clean packed-artifact import smoke passed before this status update.
  residual_risk: SDK, MCP, REST, Runtime, worker, frontend, adapter, security, and cross-network conformance consumers have not adopted the package and remain subject to follow-up review.
